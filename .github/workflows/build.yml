name: Build Releases

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  # ── Windows (installer + portable) ────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Installer
        run: npm run build:installer

      - name: Build Portable (ZIP)
        run: npm run build:portable

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/installer/*.exe
          if-no-files-found: warn

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable
          path: dist/installer/*.zip
          if-no-files-found: warn

  # ── macOS (DMG) ──────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build macOS DMG
        run: npm run build:mac

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/installer/*.dmg
          if-no-files-found: warn

  # ── Linux (AppImage + CLI tarball) ───────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Linux AppImage
        run: npm run build:linux

      - name: Build Linux CLI
        run: npm run build:linux-cli

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/installer/*.AppImage
          if-no-files-found: warn

      - name: Upload Linux CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: dist/installer/*-linux-cli.tar.gz
          if-no-files-found: warn

  # ── Release (runs only on tag push, after all builds) ────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
