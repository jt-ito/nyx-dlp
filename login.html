<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Remote Access Login</title>
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --bg-panel: rgba(20, 20, 25, 0.6);
      --text-main: #ffffff;
      --text-muted: #888899;
      --accent-color: #6366f1;
      --accent-hover: #818cf8;
      --danger-color: #f43f5e;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: radial-gradient(circle at 50% -20%, rgba(99, 102, 241, 0.15), transparent 50%);
    }

    .login-container {
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .title {
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 8px;
      text-align: center;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0 0 32px;
      text-align: center;
    }

    .tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .tab.active {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .btn {
      width: 100%;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .error-msg {
      color: var(--danger-color);
      font-size: 13px;
      text-align: center;
      margin-top: 16px;
      min-height: 16px;
    }

    .shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    /* PIN specific styling */
    .pin-inputs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .pin-char {
      width: 48px;
      height: 56px;
      font-size: 24px;
      text-align: center;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s;
    }

    .pin-char:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container" id="login-box">
    <h1 class="title">Welcome Back</h1>
    <p class="subtitle">Authenticate to access nyx-dlp</p>

    <div class="tabs">
      <div class="tab active" id="tab-pin" onclick="switchTab('pin')">Use PIN</div>
      <div class="tab" id="tab-acc" onclick="switchTab('acc')">Use Account</div>
    </div>

    <div id="form-pin">
      <div class="form-label" style="text-align:center; margin-bottom: 12px;">Enter your 4-6 digit PIN</div>
      <input type="password" id="pin-input" class="form-input" style="text-align:center; letter-spacing: 8px; font-size: 24px;" maxlength="6" autofocus />
      <button class="btn" onclick="submitPin()">Login</button>
    </div>

    <div id="form-acc" class="hidden">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="username" class="form-input" placeholder="admin" />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" />
      </div>
      <button class="btn" onclick="submitAccount()">Login</button>
    </div>

    <div class="error-msg" id="error-msg"></div>
  </div>

  <script>
    const pinInput = document.getElementById('pin-input');
    const userInp = document.getElementById('username');
    const passInp = document.getElementById('password');
    const errorMsg = document.getElementById('error-msg');
    const loginBox = document.getElementById('login-box');

    function switchTab(tab) {
      errorMsg.textContent = '';
      if (tab === 'pin') {
        document.getElementById('tab-pin').classList.add('active');
        document.getElementById('tab-acc').classList.remove('active');
        document.getElementById('form-pin').classList.remove('hidden');
        document.getElementById('form-acc').classList.add('hidden');
        pinInput.focus();
      } else {
        document.getElementById('tab-acc').classList.add('active');
        document.getElementById('tab-pin').classList.remove('active');
        document.getElementById('form-acc').classList.remove('hidden');
        document.getElementById('form-pin').classList.add('hidden');
        userInp.focus();
      }
    }

    async function doLogin(payload) {
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if (data.success) {
          window.location.href = '/';
        } else {
          showError('Invalid credentials');
        }
      } catch (err) {
        showError('Network error');
      }
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      loginBox.classList.remove('shake');
      void loginBox.offsetWidth; // trigger reflow
      loginBox.classList.add('shake');
    }

    function submitPin() {
      const pin = pinInput.value.trim();
      if (!pin) return showError('Enter a PIN');
      doLogin({ pin });
    }

    function submitAccount() {
      const username = userInp.value.trim();
      const password = passInp.value.trim();
      if (!username || !password) return showError('Enter both username and password');
      doLogin({ username, password });
    }

    userInp.addEventListener('keydown', e => { if (e.key === 'Enter') { if (passInp.value) submitAccount(); else passInp.focus(); } });
    pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitPin(); });
    passInp.addEventListener('keydown', e => { if (e.key === 'Enter') submitAccount(); });
  </script>
</body>
</html>
